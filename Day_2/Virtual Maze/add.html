<!DOCTYPE html>
<html>
<head>
  <title>Add Student</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Add Student</h1>
<form id="studentForm">
    <p>Name :
  <input type="text" id="name" placeholder="eg. Mikey"><br><br>
  <p>Email :
  <input type="email" id="email" placeholder="eg. mikey@gmail.com"><br><br>
  <p>Age :
  <input type="number" id="age" placeholder="eg. 18" min="0" max="150"><br><br>
  <p>Dept :
  <input type="text" id="dept" placeholder="eg. AI&DS"><br><br>
  <p>Tamil :
  <input type="number" id="tamil" placeholder="eg. 45" min="0" max="100"><br>
  <p>English :
  <input type="number" id="english" placeholder="eg. 45" min="0" max="100"><br>
  <p>Maths :
  <input type="number" id="maths" placeholder="eg. 45" min="0" max="100"><br>
  <p>Physics :
  <input type="number" id="physics" placeholder="eg. 45" min="0" max="100"><br>
  <p>Chemistry :
  <input type="number" id="chemistry" placeholder="eg. 45" min="0" max="100"><br>
  <p>CS/Bio :
  <input type="number" id="csbio" placeholder="eg. 45" min="0" max="100"><br><br>
  </p>
  <button type="submit">Save</button>
</form>
<br>
<button onclick="goHome()">Back</button>
<script src="app.js"></script>
</body>
</html>
